[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eap-generate"
version = "0.1.0"
description = "YAML-to-HCL generator for the Enterprise Agentic AI Platform (EAP)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "python-hcl2>=4.0",
]

[project.scripts]
eap-generate = "eap_generate.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
eap_generate = ["schema/*.json", "templates/*.j2"]
