# QA Pipeline — Validate buildspec
# Invokes validate_qa_repo.py to schema-validate evaluation.yaml, evaluator.yaml,
# test-cases.jsonl, and red-team JSON files.
version: 0.2

phases:
  install:
    commands:
      - pip install pyyaml --quiet 2>/dev/null || true
  build:
    commands:
      - echo "=== QA Repo Validation ==="
      - echo "Domain = $DOMAIN"
      - |
        # Download validation script from S3 artifacts bucket
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_qa_repo.py /tmp/validate_qa_repo.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/qa_repo_paths.py /tmp/qa_repo_paths.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_evaluation_yaml.py /tmp/validate_evaluation_yaml.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_evaluator_yaml.py /tmp/validate_evaluator_yaml.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_jsonl.py /tmp/validate_jsonl.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_placeholders.py /tmp/validate_placeholders.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_red_team.py /tmp/validate_red_team.py
        aws s3 cp s3://$ARTIFACTS_BUCKET/_platform/scripts/validate_conventions.py /tmp/validate_conventions.py
      - python3 /tmp/validate_qa_repo.py "$CODEBUILD_SRC_DIR"
      - echo "=== Validation passed ==="
artifacts:
  files:
    - '**/*'
